[package]
name = "yousummary"
version = "0.1.0"
edition = "2021"
description = "Fetch YouTube video metadata and transcripts, generate AI summaries. Local-first with Ollama, cloud providers supported."
license = "MIT"
authors = ["joaovl"]
repository = "https://github.com/joaovl/yousummary"
keywords = ["youtube", "summarizer", "transcript", "ollama", "llm"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
# Async runtime
tempfile = "3"
tokio = { version = "1.36", features = ["full"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

# JSON handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI
clap = { version = "4.4", features = ["derive", "env"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Regex for parsing
regex = "1.10"

# URL parsing
url = "2.5"

# Async traits
async-trait = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Web server (for serve command)
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }

# File path handling
dirs = "5.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# HTML entity decoding
html-escape = "0.2"

[[bin]]
name = "yousummary"
path = "src/main.rs"
