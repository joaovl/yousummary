services:
  yousummary:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: yousummary:latest
    container_name: yousummary
    restart: unless-stopped
    env_file: /root/yousummary.env
    expose:
      - "8000"

  gate:
    build: ./gate
    image: yousummary-gate:latest
    container_name: yousummary-gate
    restart: unless-stopped
    env_file: /root/yousummary.env
    environment:
      UPSTREAM: http://yousummary:8000
      PORT: "8160"
      HARVESTER_BUGS_URL: http://harvester:3000/api/bugs
      YOUSUMMARY_DB_PATH: /data/yousummary.db
      GATE_BIND: 0.0.0.0
    volumes:
      - /root/yousummary-data:/data
    ports:
      - "127.0.0.1:8160:8160"
    depends_on:
      - yousummary
    networks:
      - default
      - joaovpl

networks:
  joaovpl:
    external: true
